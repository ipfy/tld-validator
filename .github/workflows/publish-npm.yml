name: Ipfy TLD Validator — publish npm package

on:
  workflow_dispatch: {}
  # Manual trigger only, on purpose. Unlike the weekly data refresh —
  # which is just a git commit, trivially revertable — an npm publish
  # is effectively permanent (unpublishing is restricted after 72
  # hours). Requiring a manual click keeps that decision deliberate.
  #
  # If you'd rather this run fully hands-off on a schedule instead,
  # replace this trigger with something like:
  #   schedule:
  #     - cron: '17 5 1 * *'   # 1st of the month, 05:17 UTC

permissions:
  contents: write
  id-token: write
  # id-token: write is what enables npm Trusted Publishing (OIDC) — it
  # lets this workflow prove its identity directly to npm at publish
  # time, so no NPM_TOKEN secret is needed at all. Requires the
  # Trusted Publisher to be configured once on the package's Settings
  # page on npmjs.com (Organization: ipfy, Repository: tld-validator,
  # Workflow filename: publish-npm.yml) — see README.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm is new enough for Trusted Publishing
        run: npm install -g npm@latest
        # OIDC support needs a recent npm CLI (11.5.1+). This guarantees
        # it regardless of whatever npm version ships with the Node
        # version above.

      - name: Bump version
        run: npm version patch --no-git-tag-version

      - name: Publish to npm
        run: npm publish --access public
        # No NODE_AUTH_TOKEN here on purpose — authentication happens
        # via GitHub's OIDC identity, verified against the Trusted
        # Publisher configuration on npm's side. There is no stored
        # secret for this step at all anymore.

      - name: Commit version bump and bundled data snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json data/tld.json
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: publish @ipfy/tld-validator v$VERSION"
          git push
